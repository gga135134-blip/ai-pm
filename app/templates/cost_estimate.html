<div style="font-size:13px;font-family:var(--mono)">
    <div style="display:flex;justify-content:space-between;padding:4px 0">
        <span style="color:var(--ink-3);font-family:var(--sans)">模型</span>
        <span style="color:var(--ink-1)">{{ estimate.model_label }}</span>
    </div>
    <div style="display:flex;justify-content:space-between;padding:4px 0">
        <span style="color:var(--ink-3);font-family:var(--sans)">预估输入</span>
        <span style="color:var(--ink-1)">~{{ estimate.input_tokens_est }} tokens</span>
    </div>
    <div style="display:flex;justify-content:space-between;padding:4px 0">
        <span style="color:var(--ink-3);font-family:var(--sans)">预估输出</span>
        <span style="color:var(--ink-1)">~{{ estimate.output_tokens_est }} tokens</span>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:8px;margin-top:6px">
        <span style="color:var(--ink-2);font-family:var(--sans);font-weight:600">预估费用</span>
        <span style="color:var(--ai);font-weight:700;font-size:15px">${{ '%.4f' % estimate.cost_est }}</span>
    </div>
</div>
