<div class="text-sm space-y-2">
    <div class="flex justify-between">
        <span class="text-gray-500">模型</span>
        <span class="text-gray-800">{{ estimate.model_label }}</span>
    </div>
    <div class="flex justify-between">
        <span class="text-gray-500">预估输入</span>
        <span class="text-gray-800">~{{ estimate.input_tokens_est }} tokens</span>
    </div>
    <div class="flex justify-between">
        <span class="text-gray-500">预估输出</span>
        <span class="text-gray-800">~{{ estimate.output_tokens_est }} tokens</span>
    </div>
    <div class="flex justify-between border-t pt-2 mt-2">
        <span class="text-gray-700 font-medium">预估费用</span>
        <span class="text-purple-600 font-bold">${{ '%.4f' % estimate.cost_est }}</span>
    </div>
</div>
