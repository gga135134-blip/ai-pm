{% extends "base.html" %}
{% block title %}{{ '编辑笔记' if note else '新建笔记' }} - AI 项目管理{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">{{ '编辑笔记' if note else '新建笔记' }}</h1>
    <form method="POST" action="{{ '/notes/' + note.id + '/edit' if note else '/notes/new' }}" class="bg-white rounded-lg shadow-sm p-6 space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">标题</label>
            <input type="text" name="title" value="{{ note.title if note else '' }}" required placeholder="笔记标题"
                class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">内容 (支持 Markdown)</label>
            <textarea name="content" rows="16" placeholder="写点什么..."
                class="w-full border rounded-lg px-3 py-2 text-sm font-mono focus:ring-2 focus:ring-blue-500 outline-none" style="tab-size:4">{{ note.content if note else '' }}</textarea>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">作者</label>
                <input type="text" name="author" value="{{ note.author if note else '' }}" placeholder="你的名字"
                    class="w-full border rounded-lg px-3 py-2 text-sm outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">标签 (逗号分隔)</label>
                <input type="text" name="tags" value="{{ note.tags if note else '' }}" placeholder="会议记录,产品设计,重要"
                    class="w-full border rounded-lg px-3 py-2 text-sm outline-none">
            </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">关联项目 (可选)</label>
                <select name="project_id" class="w-full border rounded-lg px-3 py-2 text-sm outline-none">
                    <option value="">不关联</option>
                    {% for p in projects %}
                    <option value="{{ p.id }}" {{ 'selected' if (note and note.project_id == p.id) or (pre_project == p.id) }}>{{ p.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">关联任务 ID (可选)</label>
                <input type="text" name="task_id" value="{{ note.task_id if note and note.task_id else pre_task }}" placeholder="留空或粘贴任务 ID"
                    class="w-full border rounded-lg px-3 py-2 text-sm outline-none">
            </div>
        </div>
        <div class="flex gap-3 pt-2">
            <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg text-sm hover:bg-blue-700 transition">保存</button>
            <a href="{{ '/notes/' + note.id if note else '/notes' }}" class="px-6 py-2 rounded-lg text-sm text-gray-600 hover:bg-gray-100 transition">取消</a>
        </div>
    </form>
</div>
{% endblock %}
