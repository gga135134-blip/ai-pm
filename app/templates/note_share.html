<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if note %}{{ note.title }}{% else %}链接已失效{% endif %}</title>
    <link href="/static/tailwind.min.css" rel="stylesheet">
    <style>
        :root{
          --page:#0d1917; --bg:#132422; --panel-2:#1a2d2a; --border:rgba(255,255,255,.09);
          --ink-1:#e8f0f1; --ink-2:#a6b3b5; --ink-3:#7e8c8f;
          --accent:#2FD3C5;
          --shadow:0 1px 3px rgba(0,0,0,.38); --shadow-lg:0 24px 60px -40px rgba(0,0,0,.8);
          --r:14px; --r-sm:9px;
          --sans:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
          --display:"Songti SC",SimSun,serif;
        }
        @media (prefers-color-scheme: light){
          :root{
            --page:#eef2f1; --bg:#ffffff; --panel-2:#f2f6f5; --border:rgba(16,44,42,.10);
            --ink-1:#0f2322; --ink-2:#3a4b4a; --ink-3:#63736f;
            --accent:#127C77;
            --shadow:0 1px 3px rgba(19,61,58,.06); --shadow-lg:0 24px 60px -40px rgba(19,61,58,.30);
          }
        }
        *{ box-sizing:border-box; }
        html, body { background: var(--page); color: var(--ink-1); }
        body { font-family: var(--sans); margin:0; }
        .doc { max-width: 760px; margin: 0 auto; padding: 24px 16px 80px; }
        .doc-card{ background:var(--bg); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow-lg); padding:24px; }
        .doc-title{ font-family:var(--display); font-size:24px; font-weight:600; color:var(--ink-1); margin:0 0 8px; }
        .doc-meta{ font-size:12px; color:var(--ink-3); margin-bottom:20px; padding-bottom:14px; border-bottom:1px solid var(--border); }
        .doc-foot{ text-align:center; font-size:12px; color:var(--ink-3); margin-top:20px; }
        .doc-empty{ background:var(--bg); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow-lg); padding:48px; text-align:center; margin-top:48px; }
        .doc-empty .ic{ font-size:32px; margin-bottom:10px; color:var(--ink-3); }
        .doc-empty .t{ color:var(--ink-1); font-weight:600; margin-bottom:4px; font-size:15px; }
        .doc-empty .s{ color:var(--ink-3); font-size:13px; }
        .doc-body { white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; line-height: 1.85; font-size:15px; color:var(--ink-2); }
        /* Markdown 渲染样式 */
        .doc-body p{margin:8px 0}
        .doc-body h1,.doc-body h2,.doc-body h3{font-weight:700;margin:18px 0 8px;line-height:1.3;color:var(--ink-1)}
        .doc-body h1{font-size:1.5em}.doc-body h2{font-size:1.25em}.doc-body h3{font-size:1.1em}
        .doc-body ul,.doc-body ol{margin:8px 0;padding-left:24px}
        .doc-body ul{list-style:disc}.doc-body ol{list-style:decimal}
        .doc-body a{color:var(--accent);text-decoration:underline}
        .doc-body code{background:var(--panel-2);padding:1px 5px;border-radius:4px;font-size:.9em}
        .doc-body pre{background:var(--panel-2);padding:12px;border-radius:8px;overflow-x:auto;margin:10px 0}
        .doc-body pre code{background:none;padding:0}
        .doc-body blockquote{border-left:3px solid var(--border);padding-left:12px;color:var(--ink-3);margin:10px 0}
        .doc-body img{max-width:100%;border-radius:8px;margin:10px 0}
        .doc-body table{border-collapse:collapse;margin:12px 0;display:block;overflow-x:auto;max-width:100%}
        .doc-body th,.doc-body td{border:1px solid var(--border);padding:6px 12px;text-align:left;white-space:nowrap}
        .doc-body th{background:var(--panel-2);font-weight:600}
    </style>
</head>
<body>
    <div class="doc">
        {% if note %}
        <article class="doc-card">
            <h1 class="doc-title">{{ note.title }}</h1>
            <div class="doc-meta">
                更新于 {{ note.updated_at[:16].replace('T',' ') if note.updated_at else '' }}
            </div>
            <div id="doc-body" class="doc-body">{{ note.content }}</div>
        </article>
        <p class="doc-foot">通过 AI-PM 分享 · 只读</p>
        <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
        <script>
        (function(){
            var el = document.getElementById('doc-body');
            if(el && window.marked){
                var raw = el.textContent;
                marked.setOptions({ gfm:true, breaks:true });
                el.style.whiteSpace = 'normal';
                el.innerHTML = marked.parse(raw);
            }
        })();
        </script>
        {% else %}
        <div class="doc-empty">
            <div class="ic">&#128274;</div>
            <p class="t">链接已失效或不存在</p>
            <p class="s">分享者可能已撤销此链接。</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
