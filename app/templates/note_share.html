<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if note %}{{ note.title }}{% else %}链接已失效{% endif %}</title>
    <link href="/static/tailwind.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:#f9fafb; }
        .doc { max-width: 760px; margin: 0 auto; padding: 24px 16px 80px; }
        .doc-body { white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; line-height: 1.8; }
        /* Markdown 渲染样式 */
        .doc-body p{margin:8px 0}
        .doc-body h1,.doc-body h2,.doc-body h3{font-weight:700;margin:18px 0 8px;line-height:1.3}
        .doc-body h1{font-size:1.5em}.doc-body h2{font-size:1.25em}.doc-body h3{font-size:1.1em}
        .doc-body ul,.doc-body ol{margin:8px 0;padding-left:24px}
        .doc-body ul{list-style:disc}.doc-body ol{list-style:decimal}
        .doc-body a{color:#2563eb;text-decoration:underline}
        .doc-body code{background:#f3f4f6;padding:1px 5px;border-radius:4px;font-size:.9em}
        .doc-body pre{background:#f3f4f6;padding:12px;border-radius:8px;overflow-x:auto;margin:10px 0}
        .doc-body pre code{background:none;padding:0}
        .doc-body blockquote{border-left:3px solid #e5e7eb;padding-left:12px;color:#6b7280;margin:10px 0}
        .doc-body img{max-width:100%;border-radius:8px;margin:10px 0}
        .doc-body table{border-collapse:collapse;margin:12px 0;display:block;overflow-x:auto;max-width:100%}
        .doc-body th,.doc-body td{border:1px solid #e5e7eb;padding:6px 12px;text-align:left;white-space:nowrap}
        .doc-body th{background:#f9fafb;font-weight:600}
    </style>
</head>
<body>
    <div class="doc">
        {% if note %}
        <article class="bg-white rounded-xl shadow-sm p-6 md:p-8">
            <h1 class="text-2xl font-bold text-gray-800 mb-2">{{ note.title }}</h1>
            <div class="text-xs text-gray-400 mb-6 pb-4 border-b">
                更新于 {{ note.updated_at[:16].replace('T',' ') if note.updated_at else '' }}
            </div>
            <div id="doc-body" class="doc-body text-[15px] text-gray-700">{{ note.content }}</div>
        </article>
        <p class="text-center text-xs text-gray-300 mt-6">通过 AI-PM 分享 · 只读</p>
        <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
        <script>
        (function(){
            var el = document.getElementById('doc-body');
            if(el && window.marked){
                var raw = el.textContent;
                marked.setOptions({ gfm:true, breaks:true });
                el.style.whiteSpace = 'normal';
                el.innerHTML = marked.parse(raw);
            }
        })();
        </script>
        {% else %}
        <div class="bg-white rounded-xl shadow-sm p-12 text-center mt-12">
            <div class="text-4xl mb-3">🔒</div>
            <p class="text-gray-700 font-medium mb-1">链接已失效或不存在</p>
            <p class="text-sm text-gray-400">分享者可能已撤销此链接。</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
