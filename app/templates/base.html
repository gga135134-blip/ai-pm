<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI 项目管理{% endblock %}</title>
    <link href="/static/tailwind.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .status-draft { background: #e5e7eb; color: #374151; }
        .status-active { background: #dbeafe; color: #1d4ed8; }
        .status-paused { background: #fef3c7; color: #92400e; }
        .status-done { background: #d1fae5; color: #065f46; }
        .status-pending { background: #f3f4f6; color: #6b7280; }
        .status-running { background: #dbeafe; color: #1d4ed8; }
        .status-reviewing { background: #ede9fe; color: #5b21b6; }
        .status-blocked { background: #fee2e2; color: #991b1b; }
        .status-failed { background: #fee2e2; color: #991b1b; }
        /* 本地 tailwind 裁剪版缺失的颜色类，手动补齐 */
        .bg-teal-600 { background-color: #0d9488; }
        .hover\:bg-teal-700:hover { background-color: #0f766e; }
        .focus\:ring-teal-500:focus { box-shadow: 0 0 0 2px rgba(20,184,166,.4); }
        .bg-orange-500 { background-color: #f97316; }
        .hover\:bg-orange-600:hover { background-color: #ea580c; }
        .bg-amber-500 { background-color: #f59e0b; }
        .hover\:bg-amber-600:hover { background-color: #d97706; }
        .bg-amber-50 { background-color: #fffbeb; }
        .hover\:bg-amber-100:hover { background-color: #fef3c7; }
        .text-amber-700 { color: #b45309; }
        .border-amber-200 { border-color: #fde68a; }
        .bg-violet-600 { background-color: #7c3aed; }
        .hover\:bg-violet-700:hover { background-color: #6d28d9; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-base">
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="/" class="text-2xl font-bold text-gray-800">AI-PM</a>
            <div class="flex items-center gap-4 text-base">
                {% set path = request.url.path %}
                <a href="/chat" class="text-gray-600 hover:text-gray-900 pb-1 {% if path.startswith('/chat') %}border-b-2 border-purple-500{% endif %}">AI Chat</a>
                <a href="/" class="text-gray-600 hover:text-gray-900 pb-1 {% if path == '/' %}border-b-2 border-purple-500{% endif %}">总览</a>
                <a href="/projects" class="text-gray-600 hover:text-gray-900 pb-1 {% if path.startswith('/projects') %}border-b-2 border-purple-500{% endif %}">项目</a>
                <a href="/notes" class="text-gray-600 hover:text-gray-900 pb-1 {% if path.startswith('/notes') %}border-b-2 border-purple-500{% endif %}">知识库</a>
                <a href="/decisions" class="text-gray-600 hover:text-gray-900 pb-1 {% if path.startswith('/decisions') %}border-b-2 border-purple-500{% endif %}">决策</a>
                <a href="/settings" class="text-gray-600 hover:text-gray-900 pb-1 {% if path.startswith('/settings') %}border-b-2 border-purple-500{% endif %}">设置</a>
            </div>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
