<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI 项目管理{% endblock %}</title>
    <link href="/static/tailwind.min.css" rel="stylesheet">
    <style>
        /* 颜色系统 token */
        :root {
            --c-primary:   #2563eb; /* blue-600  主操作 */
            --c-primary-h: #1d4ed8; /* blue-700  hover */
            --c-ai:        #7c3aed; /* violet-600 AI专属 */
            --c-ai-h:      #6d28d9; /* violet-700 hover */
            --c-success:   #16a34a; /* green-600  成功/启动 */
            --c-danger:    #dc2626; /* red-600    危险/删除 */
            --c-warning:   #d97706; /* amber-600  警告/驳回 */
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .status-draft { background: #e5e7eb; color: #374151; }
        .status-active { background: #dbeafe; color: #1d4ed8; }
        .status-paused { background: #fef3c7; color: #92400e; }
        .status-done { background: #d1fae5; color: #065f46; }
        .status-pending { background: #f3f4f6; color: #6b7280; }
        .status-running { background: #dbeafe; color: #1d4ed8; }
        .status-reviewing { background: #ede9fe; color: #5b21b6; }
        .status-blocked { background: #fee2e2; color: #991b1b; }
        .status-failed { background: #fee2e2; color: #991b1b; }
        /* 移动端响应式（本地 tailwind 裁剪版没有 md: 断点）*/
    .nav-desktop { display: flex; }
    .nav-mobile-btn { display: none; }
    #mob-menu { display: none; }
    @media (max-width: 767px) {
        .nav-desktop { display: none !important; }
        .nav-mobile-btn { display: flex !important; }
    }
    /* 本地 tailwind 裁剪版缺失的颜色类，手动补齐 */
        .bg-orange-500 { background-color: #f97316; }
        .hover\:bg-orange-600:hover { background-color: #ea580c; }
        .bg-amber-500 { background-color: #f59e0b; }
        .hover\:bg-amber-600:hover { background-color: #d97706; }
        .bg-amber-600 { background-color: #d97706; }
        .hover\:bg-amber-700:hover { background-color: #b45309; }
        .bg-amber-50 { background-color: #fffbeb; }
        .hover\:bg-amber-100:hover { background-color: #fef3c7; }
        .bg-amber-400 { background-color: #fbbf24; }
        .text-amber-600 { color: #d97706; }
        .text-amber-700 { color: #b45309; }
        .text-amber-800 { color: #92400e; }
        .border-amber-200 { border-color: #fde68a; }
        .border-amber-300 { border-color: #fcd34d; }
        .focus\:ring-amber-400:focus { box-shadow: 0 0 0 2px rgba(251,191,36,.4); }
        /* violet — AI 专属色 */
        .bg-violet-50  { background-color: #f5f3ff; }
        .bg-violet-100 { background-color: #ede9fe; }
        .bg-violet-600 { background-color: #7c3aed; }
        .text-violet-600 { color: #7c3aed; }
        .text-violet-700 { color: #6d28d9; }
        .border-violet-200 { border-color: #ddd6fe; }
        .border-violet-400 { border-color: #a78bfa; }
        .border-violet-500 { border-color: #8b5cf6; }
        .hover\:bg-violet-50:hover  { background-color: #f5f3ff; }
        .hover\:bg-violet-100:hover { background-color: #ede9fe; }
        .hover\:bg-violet-700:hover { background-color: #6d28d9; }
        .hover\:text-violet-600:hover { color: #7c3aed; }
        .focus\:ring-violet-500:focus { box-shadow: 0 0 0 2px rgba(139,92,246,.4); }
        /* 全局交互状态 */
        :focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; border-radius: 4px; }
        button:disabled, input:disabled, select:disabled, textarea:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-loading { opacity: 0.7; pointer-events: none; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-base">
    <nav class="bg-white shadow-sm border-b sticky top-0 z-50">
        {% set path = request.url.path %}
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" class="text-xl font-bold text-gray-800">AI-PM</a>

            <!-- 桌面端导航 -->
            <div class="nav-desktop items-center gap-5 text-sm">
                <a href="/chat" class="text-gray-600 hover:text-gray-900 pb-0.5 {% if path.startswith('/chat') %}border-b-2 border-purple-500 font-medium{% endif %}">AI Chat</a>
                <a href="/" class="text-gray-600 hover:text-gray-900 pb-0.5 {% if path == '/' %}border-b-2 border-purple-500 font-medium{% endif %}">总览</a>
                <a href="/projects" class="text-gray-600 hover:text-gray-900 pb-0.5 {% if path.startswith('/projects') %}border-b-2 border-purple-500 font-medium{% endif %}">项目</a>
                <a href="/notes" class="text-gray-600 hover:text-gray-900 pb-0.5 {% if path.startswith('/notes') %}border-b-2 border-purple-500 font-medium{% endif %}">知识库</a>
                <a href="/study" class="text-gray-600 hover:text-gray-900 pb-0.5 {% if path.startswith('/study') %}border-b-2 border-purple-500 font-medium{% endif %}">🎓 学习</a>
                <a href="/finance" class="text-gray-600 hover:text-gray-900 pb-0.5 {% if path.startswith('/finance') %}border-b-2 border-purple-500 font-medium{% endif %}">财务</a>
                <a href="/settings" class="text-gray-600 hover:text-gray-900 pb-0.5 {% if path.startswith('/settings') %}border-b-2 border-purple-500 font-medium{% endif %}">设置</a>
                <a href="/logout" class="text-xs text-gray-400 hover:text-gray-600 ml-2">退出</a>
            </div>

            <!-- 移动端汉堡按钮 -->
            <button id="mob-btn" class="nav-mobile-btn p-2 rounded-lg text-gray-600 hover:bg-gray-100" onclick="var m=document.getElementById('mob-menu');m.style.display=m.style.display==='block'?'none':'block'">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
        </div>

        <!-- 移动端下拉菜单 -->
        <div id="mob-menu" class="hidden md:hidden border-t bg-white">
            <div class="px-4 py-2 space-y-1 text-sm">
                <a href="/chat" class="flex items-center gap-3 px-3 py-2.5 rounded-lg {% if path.startswith('/chat') %}bg-purple-50 text-purple-700 font-medium{% else %}text-gray-700 hover:bg-gray-50{% endif %}">💬 AI Chat</a>
                <a href="/" class="flex items-center gap-3 px-3 py-2.5 rounded-lg {% if path == '/' %}bg-purple-50 text-purple-700 font-medium{% else %}text-gray-700 hover:bg-gray-50{% endif %}">📊 总览</a>
                <a href="/projects" class="flex items-center gap-3 px-3 py-2.5 rounded-lg {% if path.startswith('/projects') %}bg-purple-50 text-purple-700 font-medium{% else %}text-gray-700 hover:bg-gray-50{% endif %}">📁 项目</a>
                <a href="/notes" class="flex items-center gap-3 px-3 py-2.5 rounded-lg {% if path.startswith('/notes') %}bg-purple-50 text-purple-700 font-medium{% else %}text-gray-700 hover:bg-gray-50{% endif %}">📚 知识库</a>
                <a href="/study" class="flex items-center gap-3 px-3 py-2.5 rounded-lg {% if path.startswith('/study') %}bg-purple-50 text-purple-700 font-medium{% else %}text-gray-700 hover:bg-gray-50{% endif %}">🎓 学习</a>
                <a href="/finance" class="flex items-center gap-3 px-3 py-2.5 rounded-lg {% if path.startswith('/finance') %}bg-purple-50 text-purple-700 font-medium{% else %}text-gray-700 hover:bg-gray-50{% endif %}">💰 财务</a>
                <a href="/settings" class="flex items-center gap-3 px-3 py-2.5 rounded-lg {% if path.startswith('/settings') %}bg-purple-50 text-purple-700 font-medium{% else %}text-gray-700 hover:bg-gray-50{% endif %}">⚙️ 设置</a>
                <div class="border-t my-1"></div>
                <a href="/logout" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:bg-gray-50">🚪 退出登录</a>
            </div>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto px-4 py-4 md:py-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
