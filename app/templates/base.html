<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI 项目管理{% endblock %}</title>
    <link href="/static/tailwind.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .status-draft { background: #e5e7eb; color: #374151; }
        .status-active { background: #dbeafe; color: #1d4ed8; }
        .status-paused { background: #fef3c7; color: #92400e; }
        .status-done { background: #d1fae5; color: #065f46; }
        .status-pending { background: #f3f4f6; color: #6b7280; }
        .status-running { background: #dbeafe; color: #1d4ed8; }
        .status-reviewing { background: #ede9fe; color: #5b21b6; }
        .status-blocked { background: #fee2e2; color: #991b1b; }
        .status-failed { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-base">
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="/" class="text-2xl font-bold text-gray-800">AI-PM</a>
            <div class="flex items-center gap-4 text-base">
                {% set path = request.url.path %}
                <a href="/chat" class="{% if path.startswith('/chat') %}bg-purple-700{% else %}bg-purple-600{% endif %} text-white px-3 py-1 rounded-lg hover:bg-purple-700 transition font-medium">总 AI</a>
                <a href="/" class="{% if path == '/' %}text-gray-900 font-semibold border-b-2 border-purple-500{% else %}text-gray-600 hover:text-gray-900{% endif %}">总览</a>
                <a href="/projects" class="{% if path.startswith('/projects') %}text-gray-900 font-semibold border-b-2 border-purple-500{% else %}text-gray-600 hover:text-gray-900{% endif %}">项目</a>
                <a href="/notes" class="{% if path.startswith('/notes') %}text-gray-900 font-semibold border-b-2 border-purple-500{% else %}text-gray-600 hover:text-gray-900{% endif %}">知识库</a>
                <a href="/decisions" class="{% if path.startswith('/decisions') %}text-gray-900 font-semibold border-b-2 border-purple-500{% else %}text-gray-600 hover:text-gray-900{% endif %}">决策</a>
                <a href="/settings" class="{% if path.startswith('/settings') %}text-gray-900 font-semibold border-b-2 border-purple-500{% else %}text-gray-600 hover:text-gray-900{% endif %}">设置</a>
            </div>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
