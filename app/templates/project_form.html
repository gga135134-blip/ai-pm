{% extends "base.html" %}
{% block title %}{{ '编辑项目' if project else '新建项目' }} - AI 项目管理{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">{{ '编辑项目' if project else '新建项目' }}</h1>
    <form method="POST" action="{{ '/projects/' + project.id + '/edit' if project else '/projects/new' }}" class="bg-white rounded-lg shadow-sm p-6 space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">项目名称</label>
            <input type="text" name="name" value="{{ project.name if project else '' }}" required
                class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">项目描述 / 目标</label>
            <textarea name="description" rows="4"
                class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">{{ project.description if project else '' }}</textarea>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">负责人</label>
            <input type="text" name="owner" value="{{ project.owner if project else '' }}"
                class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">预算/报价 (元)</label>
                <input type="number" step="0.01" name="budget" value="{{ project.budget if project and project.budget else '0' }}"
                    class="w-full border rounded-lg px-3 py-2 text-sm outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">已收款 (元)</label>
                <input type="number" step="0.01" name="revenue" value="{{ project.revenue if project and project.revenue else '0' }}"
                    class="w-full border rounded-lg px-3 py-2 text-sm outline-none">
            </div>
        </div>
        {% if project %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">状态</label>
            <select name="status" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                {% for s in ['draft', 'active', 'paused', 'done'] %}
                <option value="{{ s }}" {{ 'selected' if project.status == s }}>{{ s }}</option>
                {% endfor %}
            </select>
        </div>
        {% endif %}
        <div class="flex gap-3 pt-2">
            <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg text-sm hover:bg-blue-700 transition">保存</button>
            <a href="{{ '/projects/' + project.id if project else '/projects' }}" class="px-6 py-2 rounded-lg text-sm text-gray-600 hover:bg-gray-100 transition">取消</a>
        </div>
    </form>
</div>
{% endblock %}
