{% extends "base.html" %}
{% import "_icons.html" as ic %}
{% block title %}IMA 知识库浏览 - AI 项目管理{% endblock %}
{% block topbar %}
<span class="crumb"><a href="/notes" style="color:inherit;text-decoration:none">知识库</a> / <b>IMA 共享知识库</b></span>
{% endblock %}
{% block content %}
<style>
.ima-wrap .frow{ cursor:pointer; }
.ima-wrap .frow.on{ background:var(--accent-soft); color:var(--accent); font-weight:600; }
.ima-item{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.ima-item .nt{ font-size:14px; font-weight:500; color:var(--ink-1); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:1; }
.ima-msg{ font-size:12px; margin-top:6px; color:var(--ink-3); }
.ima-msg.ok{ color:var(--up); }
.ima-msg.err{ color:var(--down); }
</style>

<div class="pname" style="font-size:22px;margin-bottom:16px">IMA 共享知识库</div>

<div class="kb ima-wrap">
    <!-- 左侧：知识库列表 -->
    <div class="kb-side">
        <!-- 添加知识库 -->
        <div class="kb-grp">
            <div class="gh"><span>添加共享知识库</span></div>
            <div class="field" style="margin-bottom:8px">
                <input id="kb-url-input" type="text" placeholder="粘贴数字 KB-ID 或分享链接…" class="input" onkeydown="if(event.key==='Enter')addKB()">
            </div>
            <div class="field" style="margin-bottom:8px">
                <input id="kb-name-input" type="text" placeholder="知识库名称（选填）" class="input">
            </div>
            <button onclick="addKB()" id="add-kb-btn" class="btn primary" style="width:100%;justify-content:center">{{ ic.icon('plus') }}添加</button>
            <div id="add-kb-msg" class="ima-msg"></div>
        </div>

        <!-- 已收藏 -->
        <div class="kb-grp">
            <div class="gh"><span>已添加的知识库</span></div>
            <div id="saved-kb-list"><p class="empty" style="padding:8px 4px;text-align:left">加载中…</p></div>
        </div>

        <!-- 我的（有写权限）-->
        <div class="kb-grp">
            <div class="gh"><span>我的知识库</span></div>
            <div id="kb-list"><p class="empty" style="padding:8px 4px;text-align:left">加载中…</p></div>
        </div>
    </div>

    <!-- 右侧：条目列表 -->
    <div class="kb-list">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
            <div id="kb-title" class="pname" style="font-size:16px">← 选择左侧知识库</div>
            <div id="kb-count" style="font-size:12.5px;color:var(--ink-3)"></div>
        </div>
        <div id="items-area"></div>
        <div id="load-more-area" style="margin-top:14px;text-align:center"></div>
    </div>
</div>

<script>
var currentKbId = '';
var currentKbName = '';
var nextCursor = '';

function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function addKB() {
    var urlInput = document.getElementById('kb-url-input');
    var nameInput = document.getElementById('kb-name-input');
    var btn = document.getElementById('add-kb-btn');
    var msg = document.getElementById('add-kb-msg');
    var raw = urlInput.value.trim();
    if (!raw) { msg.textContent = '请粘贴分享链接'; msg.className = 'ima-msg err'; return; }
    var orig = btn.innerHTML; btn.textContent = '添加中…'; btn.disabled = true; msg.textContent = ''; msg.className = 'ima-msg';
    try {
        var r = await fetch('/notes/ima/add-kb', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({url_or_id: raw, name: nameInput.value.trim()})
        });
        var d = await r.json();
        if (d.ok) {
            msg.textContent = '已添加：' + d.kb.name;
            msg.className = 'ima-msg ok';
            urlInput.value = ''; nameInput.value = '';
            loadSavedKBs();
        } else {
            msg.textContent = d.msg;
            msg.className = 'ima-msg err';
        }
    } catch(e) {
        msg.textContent = String(e); msg.className = 'ima-msg err';
    }
    btn.innerHTML = orig; btn.disabled = false;
}

async function loadSavedKBs() {
    var el = document.getElementById('saved-kb-list');
    try {
        var r = await fetch('/notes/ima/saved-kbs');
        var d = await r.json();
        if (!d.kbs || !d.kbs.length) {
            el.innerHTML = '<p class="empty" style="padding:8px 4px;text-align:left">暂无，粘贴链接添加</p>';
            return;
        }
        renderKBListInto(el, d.kbs);
    } catch(e) {
        el.innerHTML = '<p class="empty" style="padding:8px 4px;text-align:left;color:var(--down)">' + esc(String(e)) + '</p>';
    }
}

async function loadKBs() {
    var el = document.getElementById('kb-list');
    try {
        var r = await fetch('/notes/ima/kbs');
        var d = await r.json();
        if (!d.ok) { el.innerHTML = '<p class="empty" style="padding:8px 4px;text-align:left;color:var(--down)">' + esc(d.msg) + '</p>'; return; }
        if (!d.kbs || !d.kbs.length) {
            el.innerHTML = '<p class="empty" style="padding:8px 4px;text-align:left">无。可用搜索框查找共享库。</p>';
            return;
        }
        renderKBList(d.kbs);
    } catch(e) {
        el.innerHTML = '<p class="empty" style="padding:8px 4px;text-align:left;color:var(--down)">加载失败：' + esc(String(e)) + '</p>';
    }
}

function selectKB(kbId, kbName) {
    // 高亮选中
    if (currentKbId) {
        var old = document.getElementById('kb-btn-' + currentKbId);
        if (old) old.classList.remove('on');
    }
    currentKbId = kbId;
    currentKbName = kbName;
    nextCursor = '';
    var btn = document.getElementById('kb-btn-' + kbId);
    if (btn) btn.classList.add('on');

    document.getElementById('kb-title').textContent = kbName;
    document.getElementById('kb-count').textContent = '';
    document.getElementById('items-area').innerHTML = '<p class="empty">加载中…</p>';
    document.getElementById('load-more-area').innerHTML = '';
    loadItems(false);
}

async function loadItems(append) {
    var area = document.getElementById('items-area');
    var moreArea = document.getElementById('load-more-area');
    moreArea.innerHTML = '';
    try {
        var url = '/notes/ima/kb-items?kb_id=' + encodeURIComponent(currentKbId);
        if (nextCursor) url += '&cursor=' + encodeURIComponent(nextCursor);
        var r = await fetch(url);
        var d = await r.json();
        if (!d.ok) {
            area.innerHTML = '<p class="empty" style="color:var(--down)">' + esc(d.msg) + '</p>';
            return;
        }
        if (!append) area.innerHTML = '';
        if (!d.items || !d.items.length) {
            if (!append) area.innerHTML = '<p class="empty">该知识库暂无内容</p>';
            return;
        }
        var html = d.items.map(function(item) {
            return '<div class="note"><div class="ima-item">'
                + '<span class="nt">' + esc(item.title || '（无标题）') + '</span>'
                + '<button type="button" class="btn primary" onclick="createNote(\'' + esc(item.media_id) + '\',\'' + esc(item.title || '无标题') + '\')">'
                + '{{ ic.icon("file") }}新建笔记</button>'
                + '</div></div>';
        }).join('');
        area.insertAdjacentHTML('beforeend', html);
        nextCursor = d.next_cursor || '';
        if (!d.is_end && nextCursor) {
            moreArea.innerHTML = '<button type="button" onclick="loadItems(true)" class="btn">加载更多</button>';
        }
    } catch(e) {
        area.innerHTML = '<p class="empty" style="color:var(--down)">加载失败：' + esc(String(e)) + '</p>';
    }
}

async function createNote(mediaId, title) {
    var btn = event.target.closest('button');
    var orig = btn.innerHTML;
    btn.textContent = '创建中…'; btn.disabled = true;
    try {
        var r = await fetch('/notes/ima/create-from-kb', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({media_id: mediaId, title: title, kb_name: currentKbName})
        });
        var d = await r.json();
        if (d.ok && d.note_id) {
            window.location.href = '/notes/' + d.note_id + '/edit';
        } else {
            alert('创建失败：' + (d.msg || '未知错误'));
            btn.innerHTML = orig; btn.disabled = false;
        }
    } catch(e) {
        alert('请求失败：' + e);
        btn.innerHTML = orig; btn.disabled = false;
    }
}

async function searchKBs() {
    var q = document.getElementById('kb-search').value.trim();
    if (!q) { loadKBs(); return; }
    var el = document.getElementById('kb-list');
    el.innerHTML = '<p class="empty" style="padding:8px 4px;text-align:left">搜索中…</p>';
    try {
        var r = await fetch('/notes/ima/kbs?q=' + encodeURIComponent(q));
        var d = await r.json();
        if (!d.ok) { el.innerHTML = '<p class="empty" style="padding:8px 4px;text-align:left;color:var(--down)">' + esc(d.msg) + '</p>'; return; }
        if (!d.kbs || !d.kbs.length) {
            el.innerHTML = '<p class="empty" style="padding:8px 4px;text-align:left">未找到「' + esc(q) + '」</p>';
            return;
        }
        renderKBList(d.kbs);
    } catch(e) {
        el.innerHTML = '<p class="empty" style="padding:8px 4px;text-align:left;color:var(--down)">搜索失败：' + esc(String(e)) + '</p>';
    }
}

function renderKBListInto(el, kbs) {
    el.innerHTML = kbs.map(function(kb) {
        return '<div class="frow' + (currentKbId === kb.id ? ' on' : '') + '" id="kb-btn-' + esc(kb.id) + '" onclick="selectKB(\'' + esc(kb.id) + '\',\'' + esc(kb.name) + '\')">'
            + '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(kb.name) + '</span>'
            + '</div>';
    }).join('');
}
function renderKBList(kbs) { renderKBListInto(document.getElementById('kb-list'), kbs); }

loadSavedKBs();
loadKBs();
</script>

{% endblock %}
