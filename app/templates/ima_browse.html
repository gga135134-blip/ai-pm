{% extends "base.html" %}
{% block title %}IMA 知识库浏览 - AI 项目管理{% endblock %}
{% block content %}

<div class="flex items-center gap-3 mb-6">
    <a href="/notes" class="text-sm text-gray-500 hover:text-gray-700">← 返回知识库</a>
    <h1 class="text-2xl font-bold text-gray-800">IMA 共享知识库</h1>
</div>

<div id="main-layout" style="display:flex; gap:24px; min-height:70vh">
    <!-- 左侧：知识库列表 -->
    <div style="width:220px; flex-shrink:0">
        <!-- 添加知识库 -->
        <div class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">添加共享知识库</div>
        <div style="margin-bottom:14px">
            <input id="kb-url-input" type="text" placeholder="粘贴 IMA 分享链接…"
                style="width:100%;box-sizing:border-box;border:1px solid #d1d5db;border-radius:8px;padding:7px 10px;font-size:13px;outline:none;margin-bottom:6px"
                onkeydown="if(event.key==='Enter')addKB()">
            <input id="kb-name-input" type="text" placeholder="知识库名称（选填）"
                style="width:100%;box-sizing:border-box;border:1px solid #d1d5db;border-radius:8px;padding:7px 10px;font-size:13px;outline:none;margin-bottom:6px">
            <button onclick="addKB()" id="add-kb-btn"
                style="width:100%;background:#2563eb;color:white;border:none;padding:7px;border-radius:8px;font-size:13px;cursor:pointer">
                + 添加</button>
            <div id="add-kb-msg" style="font-size:12px;margin-top:4px;color:#6b7280"></div>
        </div>
        <!-- 已收藏 -->
        <div class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">已添加的知识库</div>
        <div id="saved-kb-list"><div class="text-sm text-gray-400 py-1">加载中…</div></div>
        <!-- 我的（有写权限）-->
        <div class="text-xs font-semibold text-gray-400 uppercase tracking-wide mt-4 mb-2">我的知识库</div>
        <div id="kb-list"><div class="text-sm text-gray-400 py-1">加载中…</div></div>
    </div>

    <!-- 右侧：条目列表 -->
    <div style="flex:1; min-width:0">
        <div class="flex items-center justify-between mb-4">
            <div id="kb-title" class="text-lg font-semibold text-gray-600">← 选择左侧知识库</div>
            <div id="kb-count" class="text-sm text-gray-400"></div>
        </div>
        <div id="items-area"></div>
        <div id="load-more-area" class="mt-4 text-center"></div>
    </div>
</div>

<script>
var currentKbId = '';
var currentKbName = '';
var nextCursor = '';

function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function addKB() {
    var urlInput = document.getElementById('kb-url-input');
    var nameInput = document.getElementById('kb-name-input');
    var btn = document.getElementById('add-kb-btn');
    var msg = document.getElementById('add-kb-msg');
    var raw = urlInput.value.trim();
    if (!raw) { msg.textContent = '请粘贴分享链接'; msg.style.color='#dc2626'; return; }
    btn.textContent = '添加中…'; btn.disabled = true; msg.textContent = '';
    try {
        var r = await fetch('/notes/ima/add-kb', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({url_or_id: raw, name: nameInput.value.trim()})
        });
        var d = await r.json();
        if (d.ok) {
            msg.textContent = '✅ 已添加：' + d.kb.name;
            msg.style.color = '#16a34a';
            urlInput.value = ''; nameInput.value = '';
            loadSavedKBs();
        } else {
            msg.textContent = '❌ ' + d.msg;
            msg.style.color = '#dc2626';
        }
    } catch(e) {
        msg.textContent = '❌ ' + e; msg.style.color = '#dc2626';
    }
    btn.textContent = '+ 添加'; btn.disabled = false;
}

async function loadSavedKBs() {
    var el = document.getElementById('saved-kb-list');
    try {
        var r = await fetch('/notes/ima/saved-kbs');
        var d = await r.json();
        if (!d.kbs || !d.kbs.length) {
            el.innerHTML = '<div class="text-sm text-gray-400 py-1">暂无，粘贴链接添加</div>';
            return;
        }
        renderKBListInto(el, d.kbs);
    } catch(e) {
        el.innerHTML = '<div class="text-sm text-red-600">' + esc(String(e)) + '</div>';
    }
}

async function loadKBs() {
    var el = document.getElementById('kb-list');
    try {
        var r = await fetch('/notes/ima/kbs');
        var d = await r.json();
        if (!d.ok) { el.innerHTML = '<div class="text-sm text-red-600">' + esc(d.msg) + '</div>'; return; }
        if (!d.kbs || !d.kbs.length) {
            el.innerHTML = '<div class="text-sm text-gray-400 py-2">无。可用搜索框查找共享库。</div>';
            return;
        }
        renderKBList(d.kbs);
    } catch(e) {
        el.innerHTML = '<div class="text-sm text-red-600">加载失败：' + esc(String(e)) + '</div>';
    }
}

function selectKB(kbId, kbName) {
    // 高亮选中
    if (currentKbId) {
        var old = document.getElementById('kb-btn-' + currentKbId);
        if (old) old.style.background = 'none';
    }
    currentKbId = kbId;
    currentKbName = kbName;
    nextCursor = '';
    var btn = document.getElementById('kb-btn-' + kbId);
    if (btn) btn.style.background = '#dbeafe';

    document.getElementById('kb-title').textContent = kbName;
    document.getElementById('kb-count').textContent = '';
    document.getElementById('items-area').innerHTML = '<div class="text-sm text-gray-400 py-4">加载中…</div>';
    document.getElementById('load-more-area').innerHTML = '';
    loadItems(false);
}

async function loadItems(append) {
    var area = document.getElementById('items-area');
    var moreArea = document.getElementById('load-more-area');
    moreArea.innerHTML = '';
    try {
        var url = '/notes/ima/kb-items?kb_id=' + encodeURIComponent(currentKbId);
        if (nextCursor) url += '&cursor=' + encodeURIComponent(nextCursor);
        var r = await fetch(url);
        var d = await r.json();
        if (!d.ok) {
            area.innerHTML = '<div class="text-sm text-red-600">' + esc(d.msg) + '</div>';
            return;
        }
        if (!append) area.innerHTML = '';
        if (!d.items || !d.items.length) {
            if (!append) area.innerHTML = '<div class="text-sm text-gray-400 py-8 text-center">该知识库暂无内容</div>';
            return;
        }
        var html = d.items.map(function(item) {
            return '<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:white;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:8px">'
                + '<div style="min-width:0;flex:1">'
                + '<div style="font-size:14px;color:#1f2937;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(item.title || '（无标题）') + '</div>'
                + '</div>'
                + '<button onclick="createNote(\'' + esc(item.media_id) + '\',\'' + esc(item.title || '无标题') + '\')" '
                + 'style="flex-shrink:0;margin-left:12px;background:#2563eb;color:white;border:none;padding:6px 14px;border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap" '
                + 'onmouseover="this.style.background=\'#1d4ed8\'" onmouseout="this.style.background=\'#2563eb\'">'
                + '→ 新建笔记</button>'
                + '</div>';
        }).join('');
        area.insertAdjacentHTML('beforeend', html);
        nextCursor = d.next_cursor || '';
        if (!d.is_end && nextCursor) {
            moreArea.innerHTML = '<button onclick="loadItems(true)" '
                + 'style="background:none;border:1px solid #d1d5db;padding:8px 24px;border-radius:8px;font-size:14px;color:#6b7280;cursor:pointer">'
                + '加载更多</button>';
        }
    } catch(e) {
        area.innerHTML = '<div class="text-sm text-red-600">加载失败：' + esc(String(e)) + '</div>';
    }
}

async function createNote(mediaId, title) {
    var btn = event.target;
    var orig = btn.textContent;
    btn.textContent = '创建中…'; btn.disabled = true;
    try {
        var r = await fetch('/notes/ima/create-from-kb', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({media_id: mediaId, title: title, kb_name: currentKbName})
        });
        var d = await r.json();
        if (d.ok && d.note_id) {
            window.location.href = '/notes/' + d.note_id + '/edit';
        } else {
            alert('创建失败：' + (d.msg || '未知错误'));
            btn.textContent = orig; btn.disabled = false;
        }
    } catch(e) {
        alert('请求失败：' + e);
        btn.textContent = orig; btn.disabled = false;
    }
}

async function searchKBs() {
    var q = document.getElementById('kb-search').value.trim();
    if (!q) { loadKBs(); return; }
    var el = document.getElementById('kb-list');
    el.innerHTML = '<div class="text-sm text-gray-400 py-2">搜索中…</div>';
    try {
        var r = await fetch('/notes/ima/kbs?q=' + encodeURIComponent(q));
        var d = await r.json();
        if (!d.ok) { el.innerHTML = '<div class="text-sm text-red-600">' + esc(d.msg) + '</div>'; return; }
        if (!d.kbs || !d.kbs.length) {
            el.innerHTML = '<div class="text-sm text-gray-400 py-2">未找到「' + esc(q) + '」</div>';
            return;
        }
        renderKBList(d.kbs);
    } catch(e) {
        el.innerHTML = '<div class="text-sm text-red-600">搜索失败：' + esc(String(e)) + '</div>';
    }
}

function renderKBListInto(el, kbs) {
    el.innerHTML = kbs.map(function(kb) {
        return '<button onclick="selectKB(\'' + esc(kb.id) + '\',\'' + esc(kb.name) + '\')" id="kb-btn-' + esc(kb.id) + '" '
            + 'style="width:100%;text-align:left;padding:7px 12px;border-radius:8px;font-size:13px;color:#374151;border:none;background:none;cursor:pointer;margin-bottom:2px" '
            + 'onmouseover="this.style.background=\'#eff6ff\'" onmouseout="this.style.background=(currentKbId===\'' + esc(kb.id) + '\'?\'#dbeafe\':\'none\')">'
            + esc(kb.name) + '</button>';
    }).join('');
}
function renderKBList(kbs) { renderKBListInto(document.getElementById('kb-list'), kbs); }

loadSavedKBs();
loadKBs();
</script>

{% endblock %}
