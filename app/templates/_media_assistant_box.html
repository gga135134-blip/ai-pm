<style>
#chat .msg{ margin:16px 0; }
#chat .md{ margin-top:3px; }
#chat .md-p{ margin:11px 0; line-height:1.75; }
#chat .md-h{ font-weight:700; color:var(--ink-1); margin:18px 0 8px; line-height:1.35; }
#chat .md-h:first-child{ margin-top:4px; }
#chat .md-h1{ font-size:21px; letter-spacing:.2px; }
#chat .md-h2{ font-size:18px; }
#chat .md-h3{ font-size:15.5px; }
#chat .md-h4, #chat .md-h5, #chat .md-h6{ font-size:14px; color:var(--ink-2); }
#chat .md-l{ margin:10px 0; padding-left:22px; }
#chat .md-l li{ margin:6px 0; line-height:1.7; }
#chat .md-hr{ border:0; border-top:1px solid var(--border); margin:12px 0; }
#chat .md-ic{ font-family:var(--mono); font-size:12px; background:var(--panel-2); padding:1px 5px; border-radius:4px; }
#chat .md-c{ font-family:var(--mono); font-size:12px; background:var(--panel-2); border:1px solid var(--border); border-radius:6px; padding:10px 12px; overflow-x:auto; white-space:pre; margin:8px 0; line-height:1.5; }
#chat .md-t{ border-collapse:collapse; margin:8px 0; font-size:12.5px; max-width:100%; display:block; overflow-x:auto; }
#chat .md-t th, #chat .md-t td{ border:1px solid var(--border); padding:5px 10px; text-align:left; vertical-align:top; }
#chat .md-t th{ background:var(--panel-2); font-weight:600; }
#chat .md strong{ font-weight:700; color:var(--ink-1); }
#chat .md em{ font-style:italic; }
#chat .md a{ color:var(--accent); }
</style>
<div style="display:flex; justify-content:flex-end; margin-bottom:6px">
  <button onclick="astClear()" class="btn" style="font-size:12px; padding:3px 10px; color:var(--ink-3)">🧹 清空 / 新话题</button>
</div>
<div id="chat" style="border:1px solid var(--border); border-radius:10px; padding:12px; min-height:280px; max-height:55vh; overflow-y:auto; font-size:13.5px; line-height:1.6">
  <div style="color:var(--ink-3)">加载中…</div>
</div>
<div id="ast-pending" style="margin:10px 0"></div>
<div id="ast-img-bar" style="display:none; align-items:center; gap:8px; margin-top:10px;
     font-size:12.5px; color:var(--ai); background:var(--ai-soft); border:1px solid var(--ai);
     border-radius:var(--r-sm); padding:6px 10px">
  <img id="ast-img-thumb" alt="" style="width:36px; height:36px; object-fit:cover; border-radius:4px">
  <span id="ast-img-name" style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap"></span>
  <button onclick="astClearImg()" class="btn ghost" style="font-size:12px; padding:2px 8px">移除</button>
</div>
<div style="display:flex; gap:8px; margin-top:10px; align-items:flex-end">
  <button onclick="document.getElementById('ast-file').click()" class="btn" title="传张图让它看（截图可直接 Ctrl+V 粘进输入框）"
          style="flex:0 0 auto; padding:9px 11px; font-size:15px; line-height:1">📎</button>
  <input type="file" id="ast-file" accept="image/*" style="display:none" onchange="astPickImg(this.files[0])">
  {# 占位文字务必短。手机上抽屉 94vw、再扣掉 📎 和发送键，输入框只剩 ~144px，
     稍长一点就折行把空框撑成两行还被截断（这个坑踩过两次）。
     「回车发送」的提示挪到抽屉副标题，这里只留最短的。 #}
  <textarea id="ast-input" rows="1" placeholder="跟助手说…" title="回车发送，Shift+回车换行，截图可直接粘贴"
            style="flex:1; padding:9px 12px; resize:none; overflow-y:auto; max-height:160px;
                   line-height:1.6; font-family:inherit; font-size:inherit"
            oninput="astGrow(this)"
            onkeydown="astKey(event)"
            onpaste="astPaste(event)"></textarea>
  <button onclick="astSend()" id="ast-btn" class="btn primary" style="flex:0 0 auto">发送</button>
</div>
<div id="ast-status" style="font-size:12px; color:var(--ai); margin-top:6px; min-height:16px"></div>
<script>
const chat=document.getElementById('chat');
const MD_CODE='';
function mdEsc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function mdInline(s){
  return s
    .replace(/`([^`]+)`/g,'<code class="md-ic">$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
// 轻量 markdown 渲染：标题/粗细/斜体/行内码/代码块/表格/有序无序列表/分割线/段落。先转义再渲染防 XSS。
function renderMd(src){
  src=(src||'').replace(/\r\n/g,'\n');
  const codes=[];
  src=src.replace(/```([\s\S]*?)```/g,function(_,c){ codes.push(c.replace(/^[^\n]*\n/,'')); return MD_CODE+'CODE'+(codes.length-1)+MD_CODE; });
  src=mdEsc(src);
  const lines=src.split('\n'); const out=[]; let i=0;
  const isList=l=>/^\s*([-*+]|\d+[.、)）])\s+/.test(l);
  const isHead=l=>/^#{1,6}\s+/.test(l);
  const tableSep=l=>/^\s*\|?[\s:|-]+\|?\s*$/.test(l) && /-/.test(l);
  const cells=r=>r.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>mdInline(c.trim()));
  while(i<lines.length){
    const ln=lines[i];
    if(/\|/.test(ln) && i+1<lines.length && tableSep(lines[i+1])){
      const header=ln; i+=2; const body=[];
      while(i<lines.length && /\|/.test(lines[i]) && lines[i].trim()){ body.push(lines[i]); i++; }
      let t='<table class="md-t"><thead><tr>'+cells(header).map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>';
      body.forEach(r=>{ t+='<tr>'+cells(r).map(c=>'<td>'+c+'</td>').join('')+'</tr>'; });
      out.push(t+'</tbody></table>'); continue;
    }
    const hm=ln.match(/^(#{1,6})\s+(.*)$/);
    if(hm){ out.push('<div class="md-h md-h'+hm[1].length+'">'+mdInline(hm[2])+'</div>'); i++; continue; }
    if(/^\s*([-*_])\1\1[-*_\s]*$/.test(ln)){ out.push('<hr class="md-hr">'); i++; continue; }
    if(isList(ln)){
      const ordered=/^\s*\d/.test(ln); const items=[];
      while(i<lines.length && isList(lines[i])){ items.push('<li>'+mdInline(lines[i].replace(/^\s*([-*+]|\d+[.、)）])\s+/,''))+'</li>'); i++; }
      out.push('<'+(ordered?'ol':'ul')+' class="md-l">'+items.join('')+'</'+(ordered?'ol':'ul')+'>'); continue;
    }
    const cm=ln.match(new RegExp('^'+MD_CODE+'CODE(\\d+)'+MD_CODE+'$'));
    if(cm){ out.push('<pre class="md-c">'+mdEsc(codes[+cm[1]])+'</pre>'); i++; continue; }
    if(/^\s*$/.test(ln)){ i++; continue; }
    const para=[ln]; i++;
    while(i<lines.length && lines[i].trim() && !isHead(lines[i]) && !isList(lines[i]) &&
          !(/\|/.test(lines[i]) && i+1<lines.length && tableSep(lines[i+1]))){
      para.push(lines[i]); i++;
    }
    out.push('<p class="md-p">'+para.map(mdInline).join('<br>')+'</p>');
  }
  return out.join('').replace(new RegExp(MD_CODE+'CODE(\\d+)'+MD_CODE,'g'),function(_,n){ return '<pre class="md-c">'+mdEsc(codes[+n])+'</pre>'; });
}
function bubble(who,text){
  const d=document.createElement('div'); d.className='msg';
  /* 识图是机器读出来的上下文，不是对话参与者——用弱色，跟你和助手区分开 */
  const c = who==='助手' ? 'var(--ai)' : (who==='识图' ? 'var(--ink-3)' : 'var(--ink-1)');
  const label='<b class="who" style="color:'+c+'">'+who+'：</b>';
  d.innerHTML=label+'<div class="md">'+renderMd(text)+'</div>';
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
}
async function initHistory(){
  try{
    const d=await (await fetch('/media/assistant/history')).json();
    chat.innerHTML='';
    if(!d.messages || !d.messages.length){ chat.innerHTML='<div style="color:var(--ink-3)">还没聊过。试试："列一下最近的周期复盘" 或 "针对某条写下一条"。</div>'; return; }
    d.messages.forEach(function(m){ bubble(m.role==='assistant'?'助手':'我', m.content); });
  }catch(e){ chat.innerHTML=''; }
}
/* 输入框随内容长高，到 160px 封顶后内部滚动。 */
function astGrow(el){
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}
/* 回车发送、Shift+回车换行。
   isComposing 是关键：中文输入法打拼音时按回车是「选词」，
   不判断这个会把还没打完的半截话直接发出去。 */
function astKey(e){
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
    e.preventDefault();
    astSend();
  }
}
/* ── 传图 ──
   后端拿到图先用识图模型转成文字，再把文字当消息内容送进对话（不是真多模态）。
   好处是助手的工具循环不用改，而且识别结果会显示出来——AI「看到了什么」你能核，
   出错时分得清是识图错了还是理解错了。 */
let astImg = null;
function astPickImg(f){
  if(!f) return;
  if(!f.type || f.type.indexOf('image/')!==0){ astStatus('只能传图片'); return; }
  if(f.size > 8*1024*1024){ astStatus('图片超过 8MB，压一下再传'); return; }
  astImg = f;
  document.getElementById('ast-img-name').textContent =
    (f.name || '截图') + '（' + Math.round(f.size/1024) + ' KB）';
  document.getElementById('ast-img-thumb').src = URL.createObjectURL(f);
  document.getElementById('ast-img-bar').style.display = 'flex';
}
function astClearImg(){
  astImg = null;
  document.getElementById('ast-file').value = '';
  document.getElementById('ast-img-bar').style.display = 'none';
}
/* 截图直接 Ctrl+V 粘进来——比点📎再翻文件夹快得多，这才是真实用法 */
function astPaste(e){
  const items = (e.clipboardData && e.clipboardData.items) || [];
  for(let i=0;i<items.length;i++){
    if(items[i].type && items[i].type.indexOf('image/')===0){
      const f = items[i].getAsFile();
      if(f){ e.preventDefault(); astPickImg(f); return; }
    }
  }
}
function astStatus(t){ const s=document.getElementById('ast-status'); if(s) s.textContent=t; }

async function astSend(){
  const inp=document.getElementById('ast-input'); const msg=inp.value.trim();
  if(!msg && !astImg) return;              // 有图时允许不打字
  const btn=document.getElementById('ast-btn'), st=document.getElementById('ast-status');
  if(chat.children.length===1 && chat.firstElementChild && chat.firstElementChild.style.color) chat.innerHTML='';
  bubble('我', (astImg ? '📎 ['+(astImg.name||'截图')+']\n' : '') + (msg || '（看看这张图）'));
  inp.value=''; astGrow(inp); btn.disabled=true;
  st.textContent = astImg ? '识图中，然后交给助手…' : '助手在想（可能会调工具）…';
  try{
    const fd=new FormData(); fd.append('message',msg);
    if(astImg){ fd.append('image', astImg, astImg.name || 'paste.png'); }
    const r=await fetch('/media/assistant/ask',{method:'POST',body:fd});
    const txt=await r.text(); let d; try{ d=JSON.parse(txt); }catch(_){ st.textContent='没返回内容，稍后重试'; btn.disabled=false; return; }
    if(d.ok){
      astClearImg();
      // 把识图结果摊出来——AI 看错了你一眼能发现，不然只能猜它为什么答偏
      if(d.vision){ bubble('识图', d.vision); }
      bubble('助手',d.reply);
      st.textContent=(d.steps&&d.steps.length?('调了：'+d.steps.join('、')+' · '):'')+'花费 $'+(d.cost||0).toFixed(4);
      loadPending();
    }
    else st.textContent='失败：'+(d.error||'');
  }catch(e){ st.textContent='请求失败：'+e; }
  btn.disabled=false;
}
async function loadPending(){
  const box=document.getElementById('ast-pending');
  try{
    const d=await (await fetch('/media/assistant/pending')).json();
    if(!d.pending || !d.pending.length){ box.innerHTML=''; return; }
    box.innerHTML='<div style="font-size:12px;color:var(--ink-3);margin-bottom:4px">待确认（点确认才执行）</div>'+
      d.pending.map(function(p){
        return '<div style="border:1px solid var(--ai);border-radius:8px;padding:10px;margin:6px 0;background:var(--ai-soft)">'+
          '<div style="font-size:13px;margin-bottom:6px">'+(p.summary||'').replace(/</g,'&lt;')+'</div>'+
          '<button class="btn primary" style="font-size:12px;padding:4px 12px" onclick="confirmAction(\''+p.id+'\',\'apply\')">确认</button> '+
          '<button class="btn" style="font-size:12px;padding:4px 12px" onclick="confirmAction(\''+p.id+'\',\'cancel\')">取消</button></div>';
      }).join('');
  }catch(e){}
}
async function confirmAction(id, act){
  await fetch('/media/assistant/action/'+id+'/'+act,{method:'POST'});
  loadPending();
}
async function astClear(){
  if(!confirm('清空当前人设的助手对话记录？\n\n只删聊天记录，你沉淀进库的打法/素材/爆款标记不受影响。此操作不可撤。')) return;
  const st=document.getElementById('ast-status');
  try{
    await fetch('/media/assistant/clear',{method:'POST'});
    st.textContent='已清空，新话题开始';
    initHistory(); loadPending();
  }catch(e){ st.textContent='清空失败：'+e; }
}
/* 懒加载开关：全局抽屉里嵌这个框时会先置 window.AST_LAZY=true，
   等用户真点开抽屉才调 astInit()——否则 15 个媒体页每次打开都白发两个请求。
   页面内联嵌（助手页/复盘首页）不设这个标志，保持进页就加载。 */
window.astInit = function(){ initHistory(); loadPending(); };
if (!window.AST_LAZY) {
  document.addEventListener('DOMContentLoaded', window.astInit);
}
</script>
