{% extends "base.html" %}
{% block title %}AI 助手 - 知识库{% endblock %}
{% block content %}
<div class="mb-4 text-sm text-gray-400">
    <a href="/notes" class="hover:text-gray-600">知识库</a> / <span class="text-gray-600">AI 助手</span>
</div>

<div class="max-w-4xl mx-auto">
    <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800">知识库 AI 助手</h1>
        <p class="text-sm text-gray-400 mt-1">提问、整理、分类、总结都可以直接说。先选范围，再下指令，结果可一键存为笔记</p>
    </div>

    <!-- 对话区 -->
    <div id="chat-box" class="space-y-4 mb-6 min-h-[200px]"></div>

    <!-- 加载中提示 -->
    <div id="loading" class="hidden text-center py-4">
        <span class="text-sm text-gray-400">AI 检索知识库并思考中…</span>
    </div>

    <!-- 输入区 -->
    <div class="bg-white rounded-lg shadow-sm p-4 sticky bottom-4">
        <form id="ask-form" class="space-y-2">
            <div class="flex gap-2">
                <select id="scope" class="border rounded-lg px-3 py-3 text-sm outline-none text-gray-600 max-w-[180px]">
                    <option value="auto">智能检索（按指令找）</option>
                    <option value="all">全部笔记（最近80条）</option>
                    {% if folders %}
                    <optgroup label="按文件夹">
                        {% for f in folders %}
                        <option value="folder:{{ f }}">&#128193; {{ f }}</option>
                        {% endfor %}
                    </optgroup>
                    {% endif %}
                    {% if tags %}
                    <optgroup label="按标签">
                        {% for t in tags %}
                        <option value="tag:{{ t }}"># {{ t }}</option>
                        {% endfor %}
                    </optgroup>
                    {% endif %}
                </select>
                <input type="text" id="question" placeholder="如：把这些笔记按主题分类，列出每类的核心要点和待办"
                    class="flex-1 border rounded-lg px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-teal-500" autocomplete="off">
                <button type="submit" id="ask-btn" class="bg-teal-600 text-white px-6 py-3 rounded-lg text-sm hover:bg-teal-700 transition">发送</button>
            </div>
        </form>
        <div class="flex items-center justify-between mt-2">
            <span class="text-xs text-gray-400">本页累计费用: $<span id="total-cost">0.0000</span></span>
            <div class="flex gap-3">
                <button onclick="fillExample('把这些笔记按主题分类整理，每类列出核心要点')" class="text-xs text-teal-600 hover:underline">示例:分类整理</button>
                <button onclick="fillExample('总结这些笔记，提炼出所有待办事项和风险点')" class="text-xs text-teal-600 hover:underline">示例:提炼待办</button>
                <button onclick="clearChat()" class="text-xs text-gray-400 hover:text-gray-600">清空对话</button>
            </div>
        </div>
    </div>
</div>

<!-- 存为笔记用的隐藏表单 -->
<form id="save-form" method="POST" action="/notes/chat/save" class="hidden">
    <input type="hidden" name="question" id="save-question">
    <input type="hidden" name="answer" id="save-answer">
    <input type="hidden" name="folder" id="save-folder">
</form>

<script>
var chatHistory = [];  // [{q, a}]
var totalCost = 0;

function esc(s) {
    var div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
}

function addUserMsg(text) {
    var box = document.getElementById('chat-box');
    box.insertAdjacentHTML('beforeend',
        '<div class="flex justify-end"><div class="bg-teal-600 text-white rounded-lg px-4 py-3 text-sm max-w-[80%]" style="white-space:pre-wrap">' + esc(text) + '</div></div>');
    box.lastElementChild.scrollIntoView({behavior: 'smooth'});
}

function addAiMsg(question, data) {
    var box = document.getElementById('chat-box');
    var sourcesHtml = '';
    if (data.sources && data.sources.length) {
        sourcesHtml = '<div class="mt-3 pt-3 border-t border-gray-100"><span class="text-xs text-gray-400">参考笔记: </span>'
            + data.sources.map(function(s) {
                return '<a href="/notes/' + s.id + '" target="_blank" class="text-xs text-blue-600 hover:underline mr-2">' + esc(s.title) + '</a>';
            }).join('')
            + '</div>';
    }
    var idx = chatHistory.length;
    box.insertAdjacentHTML('beforeend',
        '<div class="flex justify-start"><div class="bg-white shadow-sm rounded-lg px-4 py-3 text-sm max-w-[85%] w-full">'
        + '<div class="text-gray-800" style="white-space:pre-wrap">' + esc(data.answer) + '</div>'
        + sourcesHtml
        + '<div class="flex items-center justify-between mt-3 pt-2 border-t border-gray-100">'
        + '<span class="text-xs text-gray-400">' + esc(data.model || '') + ' / 参考' + (data.note_count || 0) + '条笔记 / $' + (data.cost || 0).toFixed(4) + '</span>'
        + '<button onclick="saveNote(' + idx + ')" class="text-xs bg-amber-50 text-amber-700 border border-amber-200 px-3 py-1 rounded hover:bg-amber-100 transition">&#128190; 存为笔记</button>'
        + '</div></div></div>');
    box.lastElementChild.scrollIntoView({behavior: 'smooth'});
}

document.getElementById('ask-form').addEventListener('submit', function(e) {
    e.preventDefault();
    var input = document.getElementById('question');
    var q = input.value.trim();
    if (!q) return;
    input.value = '';
    addUserMsg(q);
    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('ask-btn').disabled = true;

    // 带上最近 3 轮对话作为上下文
    var hist = chatHistory.slice(-3).map(function(h) {
        return 'Q: ' + h.q + '\nA: ' + h.a.substring(0, 500);
    }).join('\n\n');

    var fd = new FormData();
    fd.append('question', q);
    fd.append('history', hist);
    fd.append('scope', document.getElementById('scope').value);

    fetch('/notes/chat/ask', {method: 'POST', body: fd})
        .then(function(r) { return r.json(); })
        .then(function(data) {
            chatHistory.push({q: q, a: data.answer});
            totalCost += (data.cost || 0);
            document.getElementById('total-cost').textContent = totalCost.toFixed(4);
            addAiMsg(q, data);
        })
        .catch(function(err) {
            addAiMsg(q, {answer: '[出错了] ' + err, sources: [], model: '', cost: 0});
        })
        .finally(function() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('ask-btn').disabled = false;
        });
});

function saveNote(idx) {
    var h = chatHistory[idx];
    if (!h) return;
    var folder = prompt('存到哪个文件夹？（留空 = 不分类，用 / 分层，如 资料/AI问答）', 'AI问答');
    if (folder === null) return;
    document.getElementById('save-question').value = h.q;
    document.getElementById('save-answer').value = h.a;
    document.getElementById('save-folder').value = folder;
    document.getElementById('save-form').submit();
}

function clearChat() {
    chatHistory = [];
    document.getElementById('chat-box').innerHTML = '';
}

function fillExample(text) {
    document.getElementById('question').value = text;
    document.getElementById('question').focus();
}
</script>
{% endblock %}
