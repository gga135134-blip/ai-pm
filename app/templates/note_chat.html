{% extends "base.html" %}
{% import "_icons.html" as ic %}
{% block title %}AI 助手 - 知识库{% endblock %}
{% block topbar %}
<span class="crumb"><a href="/notes" style="color:inherit;text-decoration:none">知识库</a> / <b>AI 助手</b></span>
{% endblock %}
{% block content %}
<style>
.chat-wrap{ max-width:880px; margin:0 auto; }
.chat-head{ text-align:center; margin-bottom:22px; }
.chat-head h1{ font-family:var(--display); font-size:24px; font-weight:600; margin:0; display:flex; align-items:center; justify-content:center; gap:9px; }
.chat-head h1 .icon{ color:var(--ai); font-size:22px; }
.chat-head p{ font-size:13px; color:var(--ink-3); margin:6px 0 0; }

.chat-box{ display:flex; flex-direction:column; gap:14px; margin-bottom:18px; min-height:200px; }
.msg-row{ display:flex; }
.msg-row.user{ justify-content:flex-end; }
.msg-row.ai{ justify-content:flex-start; }
.bubble{ max-width:82%; border-radius:var(--r); padding:11px 15px; font-size:13.5px; line-height:1.65; white-space:pre-wrap; }
.bubble.user{ background:var(--accent-soft); color:var(--ink-1); border:1px solid var(--border); }
.bubble.ai{ background:var(--ai-soft); border:1px solid rgba(155,133,255,.28); box-shadow:var(--shadow); width:100%; color:var(--ink-1); }
.bubble.ai .sources{ margin-top:10px; padding-top:10px; border-top:1px solid var(--border); display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.bubble.ai .sources .lbl{ font-size:11px; color:var(--ink-3); }
.bubble .meta-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:10px; padding-top:8px; border-top:1px solid var(--border); font-size:11.5px; color:var(--ink-3); }
.plan-bubble{ border-left:3px solid var(--ai); }
.plan-title{ font-size:12px; color:var(--ai); font-weight:600; margin-bottom:6px; display:flex; align-items:center; gap:6px; }
.plan-item{ font-size:12px; color:var(--ink-2); background:var(--panel-2); border-radius:7px; padding:6px 10px; margin-top:6px; }
.plan-btns{ display:flex; gap:8px; margin-top:12px; }

.chat-loading{ text-align:center; padding:12px; font-size:13px; color:var(--ink-3); }

.chatbar{ position:sticky; bottom:12px; background:var(--bg); border:1px solid var(--border); border-radius:var(--r); padding:14px 16px; box-shadow:var(--shadow-lg); }
.chatbar-row{ display:flex; gap:8px; }
.chatbar .scope-sel{ max-width:180px; }
.chatbar-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:10px; flex-wrap:wrap; gap:10px; }
.chatbar-foot .opt{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.chatbar-foot label{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-2); cursor:pointer; }
.chatbar-foot .cost{ font-size:11.5px; color:var(--ink-3); font-family:var(--mono); }
.chatbar-foot .egs{ display:flex; gap:12px; flex-wrap:wrap; }
.chatbar-foot .eg{ font-size:11.5px; color:var(--ai); background:none; border:none; cursor:pointer; padding:0; }
.chatbar-foot .eg:hover{ text-decoration:underline; }
.chatbar-foot .clr{ font-size:11.5px; color:var(--ink-3); background:none; border:none; cursor:pointer; padding:0; }
.chatbar-foot .clr:hover{ color:var(--ink-1); }
.save-btn{ font-size:11.5px; color:var(--warn); background:rgba(240,168,104,.14); border:1px solid rgba(240,168,104,.3); padding:4px 10px; border-radius:7px; cursor:pointer; display:inline-flex; align-items:center; gap:5px; }
.save-btn:hover{ background:rgba(240,168,104,.22); }
</style>

<div class="chat-wrap">
    <div class="chat-head">
        <h1>{{ ic.icon('robot') }}知识库 AI 助手</h1>
        <p>提问、整理、分类、总结都可以直接说。先选范围，再下指令，结果可一键存为笔记</p>
    </div>

    <!-- 对话区 -->
    <div id="chat-box" class="chat-box"></div>

    <!-- 加载中提示 -->
    <div id="loading" class="hidden chat-loading">AI 检索知识库并思考中…</div>

    <!-- 输入区 -->
    <div class="chatbar">
        <form id="ask-form">
            <div class="chatbar-row">
                <select id="scope" class="input scope-sel">
                    <option value="auto">智能检索（按指令找）</option>
                    <option value="all">全部笔记（最近80条）</option>
                    {% if folders %}
                    <optgroup label="按文件夹">
                        {% for f in folders %}
                        <option value="folder:{{ f }}">{{ f }}</option>
                        {% endfor %}
                    </optgroup>
                    {% endif %}
                    {% if tags %}
                    <optgroup label="按标签">
                        {% for t in tags %}
                        <option value="tag:{{ t }}"># {{ t }}</option>
                        {% endfor %}
                    </optgroup>
                    {% endif %}
                </select>
                <input type="text" id="question" placeholder="如：把这些笔记按主题分类，列出每类的核心要点和待办"
                    class="input" style="flex:1" autocomplete="off">
                <button type="submit" id="ask-btn" class="btn primary">发送</button>
            </div>
        </form>
        <div class="chatbar-foot">
            <div class="opt">
                <label>
                    <input type="checkbox" id="organize-mode">
                    <span>整理模式（AI 实际移动笔记/打标签，需你确认后生效）</span>
                </label>
                <span class="cost">累计费用: $<span id="total-cost">0.0000</span></span>
            </div>
            <div class="egs">
                <button type="button" onclick="fillExample('把这些笔记按主题分类整理，每类列出核心要点')" class="eg">示例:分类整理</button>
                <button type="button" onclick="fillExample('把这些笔记按内容主题移动到合适的文件夹并打上标签')" class="eg">示例:自动归档</button>
                <button type="button" onclick="clearChat()" class="clr">清空对话</button>
            </div>
        </div>
    </div>
</div>

<!-- 存为笔记用的隐藏表单 -->
<form id="save-form" method="POST" action="/notes/chat/save" class="hidden">
    <input type="hidden" name="question" id="save-question">
    <input type="hidden" name="answer" id="save-answer">
    <input type="hidden" name="folder" id="save-folder">
</form>

<script>
// 聊天记录存浏览器本地，切页面/刷新不丢失
var chatHistory = [];
var totalCost = 0;
var pendingPlans = {};  // idx -> 整理方案 actions
try {
    chatHistory = JSON.parse(localStorage.getItem('kb_chat_history') || '[]');
    totalCost = parseFloat(localStorage.getItem('kb_chat_cost') || '0') || 0;
} catch (e) { chatHistory = []; totalCost = 0; }

function persist() {
    try {
        localStorage.setItem('kb_chat_history', JSON.stringify(chatHistory.slice(-30)));
        localStorage.setItem('kb_chat_cost', String(totalCost));
    } catch (e) {}
}

function esc(s) {
    var div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
}

function addUserMsg(text) {
    var box = document.getElementById('chat-box');
    box.insertAdjacentHTML('beforeend',
        '<div class="msg-row user"><div class="bubble user">' + esc(text) + '</div></div>');
    box.lastElementChild.scrollIntoView({behavior: 'smooth'});
}

function addAiMsg(question, data, idx) {
    var box = document.getElementById('chat-box');
    var sourcesHtml = '';
    if (data.sources && data.sources.length) {
        sourcesHtml = '<div class="sources"><span class="lbl">参考笔记:</span>'
            + data.sources.map(function(s) {
                return '<a href="/notes/' + s.id + '" target="_blank" class="tag ai" style="text-decoration:none">' + esc(s.title) + '</a>';
            }).join('')
            + '</div>';
    }
    if (idx === undefined) idx = chatHistory.length - 1;
    box.insertAdjacentHTML('beforeend',
        '<div class="msg-row ai"><div class="bubble ai">'
        + '<div>' + esc(data.answer) + '</div>'
        + sourcesHtml
        + '<div class="meta-row">'
        + '<span>' + esc(data.model || '') + ' / 参考' + (data.note_count || 0) + '条笔记 / $' + (data.cost || 0).toFixed(4) + '</span>'
        + '<button onclick="saveNote(' + idx + ')" class="save-btn">' + '{{ ic.icon("doc") }}' + '存为笔记</button>'
        + '</div></div></div>');
    box.lastElementChild.scrollIntoView({behavior: 'smooth'});
}

// 整理方案消息：展示 AI 的移动/打标签计划，确认后才执行
function addPlanMsg(idx, data) {
    var box = document.getElementById('chat-box');
    var listHtml = '';
    if (data.actions && data.actions.length) {
        listHtml = data.actions.map(function(a) {
            var parts = [];
            if (a.folder) parts.push('移到 ' + esc(a.folder));
            if (a.add_tags && a.add_tags.length) parts.push('加标签 ' + a.add_tags.map(function(t){return '#' + esc(t);}).join(' '));
            return '<div class="plan-item">【' + esc(a.title) + '】 &rarr; ' + parts.join('，') + '</div>';
        }).join('');
    }
    var btnHtml = '';
    if (data.actions && data.actions.length) {
        btnHtml = '<div id="plan-btns-' + idx + '" class="plan-btns">'
            + '<button onclick="applyPlan(' + idx + ')" class="btn primary">确认应用 ' + data.actions.length + ' 条更改</button>'
            + '<button onclick="dismissPlan(' + idx + ')" class="btn ghost">忽略</button>'
            + '</div>';
    }
    box.insertAdjacentHTML('beforeend',
        '<div class="msg-row ai"><div class="bubble ai plan-bubble">'
        + '<div class="plan-title">' + '{{ ic.icon("move") }}' + '整理方案</div>'
        + '<div>' + esc(data.summary || '') + '</div>'
        + listHtml + btnHtml
        + '<div class="meta-row"><span>' + esc(data.model || '') + ' / $' + (data.cost || 0).toFixed(4) + '</span></div>'
        + '</div></div>');
    box.lastElementChild.scrollIntoView({behavior: 'smooth'});
}

function applyPlan(idx) {
    var actions = pendingPlans[idx];
    if (!actions) return;
    var fd = new FormData();
    fd.append('actions', JSON.stringify(actions));
    fetch('/notes/chat/apply', {method: 'POST', body: fd})
        .then(function(r) { return r.json(); })
        .then(function(data) {
            var btns = document.getElementById('plan-btns-' + idx);
            if (btns) btns.innerHTML = '<span style="font-size:12px;color:var(--up)">已应用 ' + (data.updated || 0) + ' 条更改 &middot; <a href="/notes" style="color:var(--up)">去知识库查看</a></span>';
            delete pendingPlans[idx];
            var h = chatHistory[idx];
            if (h) { h.applied = true; persist(); }
        })
        .catch(function(err) { alert('应用失败: ' + err); });
}

function dismissPlan(idx) {
    var btns = document.getElementById('plan-btns-' + idx);
    if (btns) btns.innerHTML = '<span style="font-size:12px;color:var(--ink-3)">已忽略</span>';
    delete pendingPlans[idx];
}

document.getElementById('ask-form').addEventListener('submit', function(e) {
    e.preventDefault();
    var input = document.getElementById('question');
    var q = input.value.trim();
    if (!q) return;
    var organize = document.getElementById('organize-mode').checked;
    var scope = document.getElementById('scope').value;
    input.value = '';
    addUserMsg(q);
    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('ask-btn').disabled = true;

    if (organize) {
        // 整理模式下"智能检索"意义不大，自动升级为全部笔记
        if (scope === 'auto') scope = 'all';
        var fd = new FormData();
        fd.append('question', q);
        fd.append('scope', scope);
        fetch('/notes/chat/organize', {method: 'POST', body: fd})
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var idx = chatHistory.length;
                var planText = (data.summary || '') + (data.actions && data.actions.length ? '（' + data.actions.length + ' 条更改）' : '（无更改）');
                chatHistory.push({q: q, a: '[整理方案] ' + planText, applied: false});
                pendingPlans[idx] = data.actions;
                totalCost += (data.cost || 0);
                document.getElementById('total-cost').textContent = totalCost.toFixed(4);
                persist();
                addPlanMsg(idx, data);
            })
            .catch(function(err) {
                addAiMsg(q, {answer: '[出错了] ' + err, sources: [], model: '', cost: 0});
            })
            .finally(function() {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('ask-btn').disabled = false;
            });
        return;
    }

    // 普通问答模式，带上最近 3 轮对话作为上下文
    var hist = chatHistory.slice(-3).map(function(h) {
        return 'Q: ' + h.q + '\nA: ' + h.a.substring(0, 500);
    }).join('\n\n');

    var fd = new FormData();
    fd.append('question', q);
    fd.append('history', hist);
    fd.append('scope', scope);

    fetch('/notes/chat/ask', {method: 'POST', body: fd})
        .then(function(r) { return r.json(); })
        .then(function(data) {
            chatHistory.push({q: q, a: data.answer});
            totalCost += (data.cost || 0);
            document.getElementById('total-cost').textContent = totalCost.toFixed(4);
            persist();
            addAiMsg(q, data);
        })
        .catch(function(err) {
            addAiMsg(q, {answer: '[出错了] ' + err, sources: [], model: '', cost: 0});
        })
        .finally(function() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('ask-btn').disabled = false;
        });
});

// 页面打开时恢复历史对话
(function restoreChat() {
    if (!chatHistory.length) return;
    document.getElementById('total-cost').textContent = totalCost.toFixed(4);
    chatHistory.forEach(function(h, i) {
        addUserMsg(h.q);
        addAiMsg(h.q, {answer: h.a, sources: [], model: '历史记录', cost: 0, note_count: 0}, i);
    });
})();

function saveNote(idx) {
    var h = chatHistory[idx];
    if (!h) return;
    var folder = prompt('存到哪个文件夹？（留空 = 不分类，用 / 分层，如 资料/AI问答）', 'AI问答');
    if (folder === null) return;
    document.getElementById('save-question').value = h.q;
    document.getElementById('save-answer').value = h.a;
    document.getElementById('save-folder').value = folder;
    document.getElementById('save-form').submit();
}

function clearChat() {
    if (chatHistory.length && !confirm('确定清空所有对话记录？')) return;
    chatHistory = [];
    totalCost = 0;
    pendingPlans = {};
    persist();
    document.getElementById('chat-box').innerHTML = '';
    document.getElementById('total-cost').textContent = '0.0000';
}

function fillExample(text) {
    document.getElementById('question').value = text;
    document.getElementById('question').focus();
}
</script>
{% endblock %}
