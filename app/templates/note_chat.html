{% extends "base.html" %}
{% block title %}AI 助手 - 知识库{% endblock %}
{% block content %}
<div class="mb-4 text-sm text-gray-400">
    <a href="/notes" class="hover:text-gray-600">知识库</a> / <span class="text-gray-600">AI 助手</span>
</div>

<div class="max-w-4xl mx-auto">
    <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800">知识库 AI 助手</h1>
        <p class="text-sm text-gray-400 mt-1">提问、整理、分类、总结都可以直接说。先选范围，再下指令，结果可一键存为笔记</p>
    </div>

    <!-- 对话区 -->
    <div id="chat-box" class="space-y-4 mb-6 min-h-[200px]"></div>

    <!-- 加载中提示 -->
    <div id="loading" class="hidden text-center py-4">
        <span class="text-sm text-gray-400">AI 检索知识库并思考中…</span>
    </div>

    <!-- 输入区 -->
    <div class="bg-white rounded-lg shadow-sm p-4 sticky bottom-4">
        <form id="ask-form" class="space-y-2">
            <div class="flex gap-2">
                <select id="scope" class="border rounded-lg px-3 py-3 text-sm outline-none text-gray-600 max-w-[180px]">
                    <option value="auto">智能检索（按指令找）</option>
                    <option value="all">全部笔记（最近80条）</option>
                    {% if folders %}
                    <optgroup label="按文件夹">
                        {% for f in folders %}
                        <option value="folder:{{ f }}">&#128193; {{ f }}</option>
                        {% endfor %}
                    </optgroup>
                    {% endif %}
                    {% if tags %}
                    <optgroup label="按标签">
                        {% for t in tags %}
                        <option value="tag:{{ t }}"># {{ t }}</option>
                        {% endfor %}
                    </optgroup>
                    {% endif %}
                </select>
                <input type="text" id="question" placeholder="如：把这些笔记按主题分类，列出每类的核心要点和待办"
                    class="flex-1 border rounded-lg px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-violet-500" autocomplete="off">
                <button type="submit" id="ask-btn" class="bg-violet-600 text-white px-6 py-3 rounded-lg text-sm hover:bg-violet-700 transition">发送</button>
            </div>
        </form>
        <div class="flex items-center justify-between mt-2">
            <div class="flex items-center gap-3">
                <label class="flex items-center gap-1 text-xs text-gray-600 cursor-pointer">
                    <input type="checkbox" id="organize-mode">
                    <span>整理模式（AI 实际移动笔记/打标签，需你确认后生效）</span>
                </label>
                <span class="text-xs text-gray-400">累计费用: $<span id="total-cost">0.0000</span></span>
            </div>
            <div class="flex gap-3">
                <button onclick="fillExample('把这些笔记按主题分类整理，每类列出核心要点')" class="text-xs text-violet-600 hover:underline">示例:分类整理</button>
                <button onclick="fillExample('把这些笔记按内容主题移动到合适的文件夹并打上标签')" class="text-xs text-violet-600 hover:underline">示例:自动归档</button>
                <button onclick="clearChat()" class="text-xs text-gray-400 hover:text-gray-600">清空对话</button>
            </div>
        </div>
    </div>
</div>

<!-- 存为笔记用的隐藏表单 -->
<form id="save-form" method="POST" action="/notes/chat/save" class="hidden">
    <input type="hidden" name="question" id="save-question">
    <input type="hidden" name="answer" id="save-answer">
    <input type="hidden" name="folder" id="save-folder">
</form>

<script>
// 聊天记录存浏览器本地，切页面/刷新不丢失
var chatHistory = [];
var totalCost = 0;
var pendingPlans = {};  // idx -> 整理方案 actions
try {
    chatHistory = JSON.parse(localStorage.getItem('kb_chat_history') || '[]');
    totalCost = parseFloat(localStorage.getItem('kb_chat_cost') || '0') || 0;
} catch (e) { chatHistory = []; totalCost = 0; }

function persist() {
    try {
        localStorage.setItem('kb_chat_history', JSON.stringify(chatHistory.slice(-30)));
        localStorage.setItem('kb_chat_cost', String(totalCost));
    } catch (e) {}
}

function esc(s) {
    var div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
}

function addUserMsg(text) {
    var box = document.getElementById('chat-box');
    box.insertAdjacentHTML('beforeend',
        '<div class="flex justify-end"><div class="bg-blue-600 text-white rounded-lg px-4 py-3 text-sm max-w-[80%]" style="white-space:pre-wrap">' + esc(text) + '</div></div>');
    box.lastElementChild.scrollIntoView({behavior: 'smooth'});
}

function addAiMsg(question, data, idx) {
    var box = document.getElementById('chat-box');
    var sourcesHtml = '';
    if (data.sources && data.sources.length) {
        sourcesHtml = '<div class="mt-3 pt-3 border-t border-gray-100"><span class="text-xs text-gray-400">参考笔记: </span>'
            + data.sources.map(function(s) {
                return '<a href="/notes/' + s.id + '" target="_blank" class="text-xs text-blue-600 hover:underline mr-2">' + esc(s.title) + '</a>';
            }).join('')
            + '</div>';
    }
    if (idx === undefined) idx = chatHistory.length - 1;
    box.insertAdjacentHTML('beforeend',
        '<div class="flex justify-start"><div class="bg-white shadow-sm rounded-lg px-4 py-3 text-sm max-w-[85%] w-full">'
        + '<div class="text-gray-800" style="white-space:pre-wrap">' + esc(data.answer) + '</div>'
        + sourcesHtml
        + '<div class="flex items-center justify-between mt-3 pt-2 border-t border-gray-100">'
        + '<span class="text-xs text-gray-400">' + esc(data.model || '') + ' / 参考' + (data.note_count || 0) + '条笔记 / $' + (data.cost || 0).toFixed(4) + '</span>'
        + '<button onclick="saveNote(' + idx + ')" class="text-xs bg-amber-50 text-amber-700 border border-amber-200 px-3 py-1 rounded hover:bg-amber-100 transition">&#128190; 存为笔记</button>'
        + '</div></div></div>');
    box.lastElementChild.scrollIntoView({behavior: 'smooth'});
}

// 整理方案消息：展示 AI 的移动/打标签计划，确认后才执行
function addPlanMsg(idx, data) {
    var box = document.getElementById('chat-box');
    var listHtml = '';
    if (data.actions && data.actions.length) {
        listHtml = '<div class="mt-2 space-y-1">' + data.actions.map(function(a) {
            var parts = [];
            if (a.folder) parts.push('移到 &#128193; ' + esc(a.folder));
            if (a.add_tags && a.add_tags.length) parts.push('加标签 ' + a.add_tags.map(function(t){return '#' + esc(t);}).join(' '));
            return '<div class="text-xs text-gray-600 bg-gray-50 rounded px-2 py-1">【' + esc(a.title) + '】 &rarr; ' + parts.join('，') + '</div>';
        }).join('') + '</div>';
    }
    var btnHtml = '';
    if (data.actions && data.actions.length) {
        btnHtml = '<div id="plan-btns-' + idx + '" class="flex gap-2 mt-3">'
            + '<button onclick="applyPlan(' + idx + ')" class="text-xs bg-violet-600 text-white px-4 py-1.5 rounded hover:bg-violet-700 transition">&#9989; 确认应用 ' + data.actions.length + ' 条更改</button>'
            + '<button onclick="dismissPlan(' + idx + ')" class="text-xs border text-gray-500 px-4 py-1.5 rounded hover:bg-gray-50 transition">忽略</button>'
            + '</div>';
    }
    box.insertAdjacentHTML('beforeend',
        '<div class="flex justify-start"><div class="bg-white shadow-sm rounded-lg px-4 py-3 text-sm max-w-[85%] w-full border-l-4 border-violet-500">'
        + '<div class="text-xs text-violet-600 font-medium mb-1">&#128736; 整理方案</div>'
        + '<div class="text-gray-800" style="white-space:pre-wrap">' + esc(data.summary || '') + '</div>'
        + listHtml + btnHtml
        + '<div class="text-xs text-gray-400 mt-2">' + esc(data.model || '') + ' / $' + (data.cost || 0).toFixed(4) + '</div>'
        + '</div></div>');
    box.lastElementChild.scrollIntoView({behavior: 'smooth'});
}

function applyPlan(idx) {
    var actions = pendingPlans[idx];
    if (!actions) return;
    var fd = new FormData();
    fd.append('actions', JSON.stringify(actions));
    fetch('/notes/chat/apply', {method: 'POST', body: fd})
        .then(function(r) { return r.json(); })
        .then(function(data) {
            var btns = document.getElementById('plan-btns-' + idx);
            if (btns) btns.innerHTML = '<span class="text-xs text-green-600">&#9989; 已应用 ' + (data.updated || 0) + ' 条更改 &middot; <a href="/notes" class="underline">去知识库查看</a></span>';
            delete pendingPlans[idx];
            var h = chatHistory[idx];
            if (h) { h.applied = true; persist(); }
        })
        .catch(function(err) { alert('应用失败: ' + err); });
}

function dismissPlan(idx) {
    var btns = document.getElementById('plan-btns-' + idx);
    if (btns) btns.innerHTML = '<span class="text-xs text-gray-400">已忽略</span>';
    delete pendingPlans[idx];
}

document.getElementById('ask-form').addEventListener('submit', function(e) {
    e.preventDefault();
    var input = document.getElementById('question');
    var q = input.value.trim();
    if (!q) return;
    var organize = document.getElementById('organize-mode').checked;
    var scope = document.getElementById('scope').value;
    input.value = '';
    addUserMsg(q);
    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('ask-btn').disabled = true;

    if (organize) {
        // 整理模式下"智能检索"意义不大，自动升级为全部笔记
        if (scope === 'auto') scope = 'all';
        var fd = new FormData();
        fd.append('question', q);
        fd.append('scope', scope);
        fetch('/notes/chat/organize', {method: 'POST', body: fd})
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var idx = chatHistory.length;
                var planText = (data.summary || '') + (data.actions && data.actions.length ? '（' + data.actions.length + ' 条更改）' : '（无更改）');
                chatHistory.push({q: q, a: '[整理方案] ' + planText, applied: false});
                pendingPlans[idx] = data.actions;
                totalCost += (data.cost || 0);
                document.getElementById('total-cost').textContent = totalCost.toFixed(4);
                persist();
                addPlanMsg(idx, data);
            })
            .catch(function(err) {
                addAiMsg(q, {answer: '[出错了] ' + err, sources: [], model: '', cost: 0});
            })
            .finally(function() {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('ask-btn').disabled = false;
            });
        return;
    }

    // 普通问答模式，带上最近 3 轮对话作为上下文
    var hist = chatHistory.slice(-3).map(function(h) {
        return 'Q: ' + h.q + '\nA: ' + h.a.substring(0, 500);
    }).join('\n\n');

    var fd = new FormData();
    fd.append('question', q);
    fd.append('history', hist);
    fd.append('scope', scope);

    fetch('/notes/chat/ask', {method: 'POST', body: fd})
        .then(function(r) { return r.json(); })
        .then(function(data) {
            chatHistory.push({q: q, a: data.answer});
            totalCost += (data.cost || 0);
            document.getElementById('total-cost').textContent = totalCost.toFixed(4);
            persist();
            addAiMsg(q, data);
        })
        .catch(function(err) {
            addAiMsg(q, {answer: '[出错了] ' + err, sources: [], model: '', cost: 0});
        })
        .finally(function() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('ask-btn').disabled = false;
        });
});

// 页面打开时恢复历史对话
(function restoreChat() {
    if (!chatHistory.length) return;
    document.getElementById('total-cost').textContent = totalCost.toFixed(4);
    chatHistory.forEach(function(h, i) {
        addUserMsg(h.q);
        addAiMsg(h.q, {answer: h.a, sources: [], model: '历史记录', cost: 0, note_count: 0}, i);
    });
})();

function saveNote(idx) {
    var h = chatHistory[idx];
    if (!h) return;
    var folder = prompt('存到哪个文件夹？（留空 = 不分类，用 / 分层，如 资料/AI问答）', 'AI问答');
    if (folder === null) return;
    document.getElementById('save-question').value = h.q;
    document.getElementById('save-answer').value = h.a;
    document.getElementById('save-folder').value = folder;
    document.getElementById('save-form').submit();
}

function clearChat() {
    if (chatHistory.length && !confirm('确定清空所有对话记录？')) return;
    chatHistory = [];
    totalCost = 0;
    pendingPlans = {};
    persist();
    document.getElementById('chat-box').innerHTML = '';
    document.getElementById('total-cost').textContent = '0.0000';
}

function fillExample(text) {
    document.getElementById('question').value = text;
    document.getElementById('question').focus();
}
</script>
{% endblock %}
